what_we_do:
  - title: Conservation
    text: Marsh cleanups, trash pickups at ramps, and support for projects that keep water levels and habitat healthy.
  - title: Safety and education
    text: Rider safety, boating etiquette, noise courtesy near homes, and respect for wildlife and other people on the water.
  - title: Community and access
    text: Rides, cookouts and meetings for members, and a unified voice on rules that affect access to the marsh.
