# Rebuilds the site every night so events drop off the page after their date,
# even when nobody has edited anything. Can also be run by hand from the
# Actions tab.
name: Nightly rebuild

on:
  schedule:
    - cron: "17 9 * * *" # about 4:17 AM Eastern
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
